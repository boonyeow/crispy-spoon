name: Hoshino Tomamu Vacancy Check

on:
  schedule:
    # Run once every hour
    - cron: "0 * * * *"

  # Allows you to manually run the check from GitHub
  workflow_dispatch:

jobs:
  check-hotel:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Check Hoshino Tomamu availability
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VACANCY_THRESHOLD: ${{ secrets.VACANCY_THRESHOLD }}
        run: |
          python check_hotel.py
